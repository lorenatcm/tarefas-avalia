<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarefas · Avalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topo" hidden>
  <div class="marca"><svg class="logo" viewBox="40 90 640 500" aria-label="Avalia"><polygon fill="#5A5A5C" points="150,100 272,100 373,576 281,576 212,248 142,576 50,576"/><polygon fill="#256BA0" points="344,100 436,100 506,428 576,100 668,100 566,576 445,576"/></svg><span class="marca-txt">Avalia <b>Tarefas</b></span></div>
  <nav id="abas"></nav>
  <div class="usuario"><span id="nome-usuario"></span><button id="sair" class="link">Sair</button></div>
</header>

<main id="app">
  <section id="tela-login" class="login" hidden>
    <div class="login-caixa">
      <div class="marca grande"><svg class="logo" viewBox="40 90 640 500" aria-label="Avalia"><polygon fill="#5A5A5C" points="150,100 272,100 373,576 281,576 212,248 142,576 50,576"/><polygon fill="#256BA0" points="344,100 436,100 506,428 576,100 668,100 566,576 445,576"/></svg><span class="marca-txt">Avalia <b>Tarefas</b></span></div>
      <p class="sub" id="login-sub">Entre com o seu e-mail da Avalia.</p>
      <form id="form-login">
        <label>E-mail<input type="email" id="login-email" required autocomplete="email" placeholder="nome@avaliarq.com.br"></label>
        <label>Senha<input type="password" id="login-senha" required minlength="8" autocomplete="current-password" placeholder="mínimo 8 caracteres"></label>
        <button type="submit" class="primario" id="login-botao">Entrar</button>
        <p class="erro" id="login-erro"></p>
      </form>
      <button class="link" id="login-alternar">Primeiro acesso? Crie sua senha</button>
    </div>
  </section>

  <section id="tela-minhas" hidden></section>
  <section id="tela-todas" hidden></section>
</main>

<div id="menu-status" class="menu-status" hidden></div>
<dialog id="dlg-tarefa"></dialog>
<div id="aviso" class="aviso" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
